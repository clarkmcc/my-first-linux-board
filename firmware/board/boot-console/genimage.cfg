image boot.vfat {
	vfat {
		files = {
			"zImage",
			"linux.dtb",
			"boot.scr"
		}
	}
	size = 16M
}

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
